[package]
name = "about-me"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"

[dependencies]
dioxus = { version = "=0.7.10", features = ["router", "fullstack"] }

[features]
default = ["web"]
web = ["dioxus/web"]
server = ["dioxus/server"]

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"
